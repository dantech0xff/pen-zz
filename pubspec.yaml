name: pen_zz
description: "Bút Chiến - vẽ vũ khí, khiên rồi đánh"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: ^1.38.2
  flame_audio: ^2.12.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/Coiny-OFL.txt
    - assets/fonts/PatrickHand-OFL.txt

  fonts:
    - family: Coiny
      fonts:
        - asset: assets/fonts/Coiny-Regular.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FBFAF3"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FBFAF3"
    theme_color: "#1D3AA8"
